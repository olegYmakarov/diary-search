<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник чтения — поиск</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a4a4a">
<style>
  body{font-family:Arial,sans-serif;max-width:480px;margin:40px auto;padding:0 20px;text-align:center}
  input{width:100%;padding:12px;font-size:18px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;margin-bottom:12px}
  button{width:100%;padding:12px;font-size:18px;background:#4a4a4a;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>
  <h2>📚 Поиск в дневнике чтения</h2>
  <input type="text" id="q" placeholder="Автор или название">
  <button onclick="go()">Искать</button>
<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd9j-4RSoixsP_VUEzlZd_ux0SmUSMzQ9wUV2Hr3g0guQFEs9ybYPta3zIWH3G-SJGfg/exec';
  function go(){
    var v = document.getElementById('q').value.trim();
    if(v){ location.href = SCRIPT_URL + '?q=' + encodeURIComponent(v); }
  }
  document.getElementById('q').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ go(); }
  });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
