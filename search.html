<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Отладка</title></head>
<body style="font-family:sans-serif;padding:20px;word-break:break-all">
<h3>Что получено:</h3>
<script>
  var p = new URLSearchParams(location.search);
  document.write('<p><b>text:</b> "' + (p.get('text') || '') + '"</p>');
  document.write('<p><b>title:</b> "' + (p.get('title') || '') + '"</p>');
  document.write('<p><b>url:</b> "' + (p.get('url') || '') + '"</p>');
  document.write('<p><b>весь query:</b> ' + location.search + '</p>');
</script>
</body>
</html>
