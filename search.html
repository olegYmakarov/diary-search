<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Поиск…</title></head>
<body>
<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd9j-4RSoixsP_VUEzlZd_ux0SmUSMzQ9wUV2Hr3g0guQFEs9ybYPta3zIWH3G-SJGfg/exec';
  var params = new URLSearchParams(location.search);
  var q = (params.get('text') || params.get('title') || '').trim();
  if (q) {
    location.replace(SCRIPT_URL + '?q=' + encodeURIComponent(q));
  } else {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:20px">Не удалось получить текст запроса.</p>';
  }
</script>
</body>
</html>
